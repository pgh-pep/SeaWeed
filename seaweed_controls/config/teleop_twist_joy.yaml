# joy -> cmd_vel (TwistStamped). Axis/button indices are for the
# Logitech F310 (see seaweed_sim/joy_enum.py).
#
# Scales are 1.0 so cmd_vel carries the raw stick value in [-1, 1].
# How that maps to thrust is configured in diff_thrust.yaml.
teleop_twist_joy_node:
  ros__parameters:
    publish_stamped_twist: true
    frame: base_link

    # Hold LB (deadman) to drive. Releasing it sends one zero command.
    require_enable_button: true
    enable_button: 4         # LB
    enable_turbo_button: -1  # disabled

    axis_linear:
      x: 1                   # left stick vertical
    scale_linear:
      x: 1.0

    axis_angular:
      yaw: 0                 # left stick horizontal
    scale_angular:
      yaw: 1.0
